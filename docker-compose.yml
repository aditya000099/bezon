version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bezon-postgres
    restart: always
    environment:
      POSTGRES_USER: bezon
      POSTGRES_PASSWORD: bezon_secure_password
      POSTGRES_DB: bezon_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: bezon-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://bezon:bezon_secure_password@postgres:5432/bezon_db
      - JWT_SECRET=bezon_super_secret_jwt_key_that_is_at_least_64_bytes_long
      - COOKIE_SECRET=bezon_cookie_secret_key_used_for_signing_cookies
      - ALLOWED_ORIGINS=http://localhost:3000
      - RAZORPAY_KEY_ID=rzp_test_mock_id
      - RAZORPAY_KEY_SECRET=mock_secret
    depends_on:
      - postgres

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: bezon-web
    restart: always
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_RAZORPAY_KEY_ID=rzp_test_mock_id
    depends_on:
      - api

volumes:
  postgres_data:
