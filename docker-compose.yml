version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bezon-postgres
    restart: always
    environment:
      POSTGRES_USER: bezon
      POSTGRES_PASSWORD: bezon_secure_password
      POSTGRES_DB: bezon_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bezon-api
    restart: always
    ports:
      - "5002:5002"
    environment:
      - NODE_ENV=production
      - PORT=5002
      - DATABASE_URL=postgresql://bezon:bezon_secure_password@postgres:5432/bezon_db
      - JWT_SECRET=bezon_super_secret_jwt_key_that_is_at_least_64_bytes_long
      - COOKIE_SECRET=bezon_cookie_secret_key_used_for_signing_cookies
      - ALLOWED_ORIGINS=http://localhost:3000
      - RAZORPAY_KEY_ID=rzp_test_mock_id
      - RAZORPAY_KEY_SECRET=mock_secret
      - S3_BUCKET_NAME=bezon-assets
      - S3_REGION=ap-south-1
      - AWS_ACCESS_KEY_ID=mock_aws_access_key
      - AWS_SECRET_ACCESS_KEY=mock_aws_secret_key
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_API_URL=http://localhost:5002
        - VITE_RAZORPAY_KEY_ID=rzp_test_mock_id
    container_name: bezon-web
    restart: always
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:5002
      - VITE_RAZORPAY_KEY_ID=rzp_test_mock_id
    depends_on:
      - api

volumes:
  postgres_data:
